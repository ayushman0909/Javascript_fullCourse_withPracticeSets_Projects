    // now see if i click on image then it both get activated because inside container image is there so i case of event bubbling(false) , the deep one means image console will show 
    // and in case of event capturing(true), the upper container get trigger first
    
    // to stop event bubbling we can use e.stopPropation() then only inside one get triggeed
    // e.preventDefault() mainly used with form

    const ImageContainer=document.querySelector(".container");
    const Images=document.querySelectorAll(".Images");
    Images.forEach((image)=>{
        image.addEventListener("click",(e)=>{
            console.log(`clicked on image with id ${e.target.id}`);
            
            e.target.style.display="none"
        })
